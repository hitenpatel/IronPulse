name: Maestro E2E (nightly)

on:
  schedule:
    # 03:30 UTC every day — RadioShake runs at 01:00 UTC and gets the
    # 01:00–03:30 window on the same Pixel 9 Pro XL. Both workflows share
    # /tmp/pixel-e2e-lock to avoid device contention.
    - cron: '30 3 * * *'
  workflow_dispatch:    # allow manual trigger from Forgejo Actions UI

jobs:
  # Pre-flight: on scheduled runs, skip the whole suite if HEAD hasn't moved
  # since the last successful nightly. Manual dispatch always runs.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_run: ${{ steps.compare.outputs.should_run }}
    steps:
      - name: Compare HEAD to last successful nightly
        id: compare
        env:
          FORGEJO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CUR_SHA: ${{ github.sha }}
          CUR_RUN: ${{ github.run_number }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          if [ "$EVENT" != "schedule" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "::notice::event=$EVENT — running e2e regardless of commit changes"
            exit 0
          fi
          export DEBIAN_FRONTEND=noninteractive
          apt-get update && apt-get install -y --no-install-recommends jq curl ca-certificates
          echo "current: SHA=$CUR_SHA run=$CUR_RUN"
          # Look up the most recent PREVIOUS successful scheduled run of THIS
          # workflow. If its head_sha matches ours, no commits landed since;
          # skip the whole e2e suite. Relies on the e2e job's final step
          # exiting non-zero on flow failures, so "success" really means green.
          # Fail open: any lookup error leaves LAST_SHA empty, which runs the
          # suite. Skipping is the risky default — a transient API blip must
          # not cost a night of coverage.
          RESP=$(curl -sfSL \
            -H "Authorization: token $FORGEJO_TOKEN" \
            "https://git.hiten-patel.co.uk/api/v1/repos/$REPO/actions/tasks?limit=50" || true)
          # This endpoint returns one entry per JOB, not per run, so the filter
          # must pin .name to "e2e". The sibling "changes" job succeeds even
          # when e2e fails — matching it would read a red tree as the last
          # green nightly and skip re-testing it.
          LAST_SHA=$(echo "$RESP" | jq -r --arg cur "$CUR_RUN" '
            .workflow_runs[]
            | select(.workflow_id == "maestro-nightly.yml"
                     and .name == "e2e"
                     and .event == "schedule"
                     and .status == "success"
                     and (.run_number|tostring) != $cur)
            | .head_sha' 2>/dev/null | head -1 || true)
          echo "last green nightly SHA: ${LAST_SHA:-<none>}"
          if [ -z "$LAST_SHA" ] || [ "$LAST_SHA" != "$CUR_SHA" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Running nightly — HEAD changed since last green run ($LAST_SHA -> $CUR_SHA)"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping nightly — no new commits since last green nightly ($LAST_SHA)"
          fi

  e2e:
    needs: changes
    if: ${{ needs.changes.outputs.should_run == 'true' }}
    runs-on: [arm64-dind]
    # Expo prebuild + gradle on arm64 is slower than a native Android build.
    # 90 min covers the build (~35 min), main suite (42 flows @ ~45s each),
    # and prod smoke (3 flows).
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install JDK 17 + ADB
        run: |
          set -eu
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends openjdk-17-jdk-headless ca-certificates curl unzip adb
          echo "JAVA_HOME=$(dirname $(dirname $(readlink -f $(which java))))" >> "$GITHUB_ENV"

      - name: Install Maestro
        run: |
          set -eu
          curl -fsSL https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          $HOME/.maestro/bin/maestro --version | head -1

      - name: Install Android SDK
        run: |
          set -eu
          ANDROID_HOME="$HOME/android-sdk"; mkdir -p "$ANDROID_HOME/cmdline-tools"
          cd "$ANDROID_HOME/cmdline-tools"
          curl -sLo cmdline.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdline.zip; mv cmdline-tools latest; rm cmdline.zip
          printf 'y\n%.0s' {1..100} | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Install qemu-user-static for x86_64 aapt2 emulation on arm64
        # Google ships aapt2 only as x86_64 even via sdkmanager. The Forgejo
        # runner image is arm64 — needs qemu-user-static + binfmt + the x86_64
        # dynamic linker / libs. See [[feedback_forgejo_actions_android]].
        run: |
          set -eu
          export DEBIAN_FRONTEND=noninteractive
          # The cross libs cover aapt2. react-native-reanimated invokes the
          # NDK's x86_64 clang under QEMU, which loads libz.so.1 and libtinfo6
          # from the amd64 root — add the amd64 dpkg architecture so those are
          # available at their real multiarch paths (the cross packages only
          # ship libc + libstdc++).
          dpkg --add-architecture amd64
          apt-get update
          apt-get install -y --no-install-recommends \
            qemu-user-static binfmt-support \
            libc6-amd64-cross libstdc++6-amd64-cross \
            libc6:amd64 libstdc++6:amd64 zlib1g:amd64 libtinfo6:amd64
          echo "QEMU_LD_PREFIX=/usr/x86_64-linux-gnu" >> "$GITHUB_ENV"
          QEMU_LD_PREFIX=/usr/x86_64-linux-gnu \
            "$ANDROID_HOME/build-tools/36.0.0/aapt2" version

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install workspace dependencies
        run: |
          set -eu
          # Pull in @mettlelift/mobile and all its workspace dependencies
          # (packages/shared, packages/api-types, etc.) so that the Expo
          # prebuild has every import available.
          pnpm install --frozen-lockfile --filter @mettlelift/mobile...

      - name: Expo prebuild (android, e2e variant)
        run: |
          set -eu
          # EXPO_PUBLIC_E2E=1 causes app.config.ts to flip applicationId to
          # com.mettlelift.app.e2e and the app name to "Mettle Lift E2E",
          # which coexists with the prod install on the Pixel.
          # Do NOT set bare E2E=1 — that triggers metro's App.e2e.tsx mock +
          # PowerSync stub (metro.config.js line 23), producing a fake app
          # with no real UI to exercise.
          cd apps/mobile
          EXPO_PUBLIC_E2E=1 \
          EXPO_PUBLIC_API_URL=https://staging.mettlelift.hiten-patel.co.uk \
            npx expo prebuild --platform android --clean --no-install

      - name: Build debug APK (com.mettlelift.app.e2e)
        run: |
          set -eu
          cd apps/mobile/android
          ./gradlew :app:assembleDebug \
            -Pandroid.aapt2FromMavenOverride="$ANDROID_HOME/build-tools/36.0.0/aapt2"
          ls -la app/build/outputs/apk/debug/app-debug.apk

      - name: Install trusted ADB key (avoids on-device USB-debug prompt)
        env:
          ADB_KEY_B64: ${{ secrets.ADB_KEY }}
          ADB_KEY_PUB_B64: ${{ secrets.ADB_KEY_PUB }}
        run: |
          set -eu
          # Job containers start fresh, so adb generates a new keypair each run
          # and the phone prompts to authorize it. We instead install the
          # developer VM's already-trusted keypair (stored as repo secrets).
          mkdir -p "$HOME/.android"
          echo "$ADB_KEY_B64" | base64 -d > "$HOME/.android/adbkey"
          echo "$ADB_KEY_PUB_B64" | base64 -d > "$HOME/.android/adbkey.pub"
          chmod 600 "$HOME/.android/adbkey"
          chmod 644 "$HOME/.android/adbkey.pub"

      - name: Wait for shared Pixel lock (yields to RadioShake)
        # RadioShake's nightly writes owner=radioshake to /tmp/pixel-e2e-lock
        # when it drives the same Pixel 9 Pro XL. Block here until any
        # RadioShake run is done, then claim the lock as zor. Max 90 min wait
        # so a stuck RadioShake run does not silently kill Zor coverage.
        run: |
          set -u
          LOCK_DIR=/tmp/pixel-e2e-lock
          MAX_WAIT=5400
          waited=0
          while [ "$waited" -lt "$MAX_WAIT" ]; do
            if [ -f "$LOCK_DIR/owner" ] && [ "$(cat "$LOCK_DIR/owner" 2>/dev/null)" = "radioshake" ]; then
              :
            elif pgrep -af "maestro.*com\.mettlelift" >/dev/null 2>&1; then
              # Belt-and-braces: block if a previous Zor maestro is still running
              :
            else
              break
            fi
            sleep 30
            waited=$((waited + 30))
          done
          if [ "$waited" -ge "$MAX_WAIT" ]; then
            echo "::error::RadioShake nightly still running after ${MAX_WAIT}s — aborting to avoid device contention"
            exit 1
          fi
          mkdir -p "$LOCK_DIR"
          echo "zor" > "$LOCK_DIR/owner"
          echo "acquired /tmp/pixel-e2e-lock as zor"

      - name: Connect to device over Tailscale ADB
        id: connect
        run: |
          set -u   # NOT -e: unreachability is handled explicitly below so the
                   # dashboard can tell "phone offline" apart from a real test
                   # regression. Wireless debugging turns OFF when the phone
                   # reboots or takes an OS update — see [[reference_wireless_adb]].
          DEVICE=100.69.203.52:5555
          # ADB connection survives unless the phone reboots/updates; retry to
          # handle transient Tailscale flaps. Treat a connect as good only when
          # getprop actually answers — `adb connect` can return 0 for an
          # already-listed-but-offline device.
          for i in 1 2 3; do
            if adb connect "$DEVICE" && adb -s "$DEVICE" shell getprop ro.product.model >/dev/null 2>&1; then
              break
            fi
            echo "ADB connect attempt $i failed, retrying..."
            sleep 5
          done
          adb devices
          if ! adb -s "$DEVICE" shell getprop ro.product.model; then
            echo "::warning::Device $DEVICE unreachable — wireless debugging is likely off (phone reboot or OS update). Skipping the E2E run and reporting DEVICE_UNREACHABLE to the dashboard."
            echo "DEVICE_UNREACHABLE=1" >> "$GITHUB_ENV"
            exit 1
          fi

      - name: Wake device + dismiss daydream + lockscreen
        env:
          ADB_PIN: ${{ secrets.ADB_PIN }}
        shell: bash
        run: |
          set -u   # NOT -e — adb/grep can return non-zero on transient state
                   # and we don't want the whole step to silently die. Failures
                   # at meaningful checkpoints are surfaced with explicit `exit 1`.
          DEVICE=100.69.203.52:5555
          # Daydream / screensaver completely off for the run — this was
          # the run #48/49 failure: DreamActivity sat on top of the
          # keyguard and ate the PIN keyevents. Disable AOD too; restored
          # in "Restore device state".
          adb -s $DEVICE shell settings put secure screensaver_enabled 0
          adb -s $DEVICE shell settings put secure doze_enabled 0
          adb -s $DEVICE shell settings put secure doze_always_on 0
          adb -s $DEVICE shell svc power stayon true
          adb -s $DEVICE shell settings put system screen_off_timeout 1800000
          # Kill any active dream so it doesn't intercept keyevents.
          adb -s $DEVICE shell am broadcast -a android.intent.action.STOP_DREAM || true
          sleep 1
          # KEYCODE_POWER (not WAKEUP) reliably transitions the Pixel from
          # mWakefulness=Dozing → Awake. WAKEUP alone left it dozing.
          # Wake until awake (max 3 attempts).
          for _ in 1 2 3; do
            adb -s $DEVICE shell input keyevent KEYCODE_POWER
            sleep 1
            if adb -s $DEVICE shell dumpsys power | grep -q "mWakefulness=Awake"; then break; fi
          done
          adb -s $DEVICE shell dumpsys power | grep mWakefulness | head -1
          # Swipe-up to surface PIN entry / kick Extend Unlock.
          adb -s $DEVICE shell input swipe 500 2000 500 500 300
          # Poll up to 8s — Extend Unlock by trusted device/place is async.
          STATE="locked"
          for _ in 1 2 3 4 5 6 7 8; do
            sleep 1
            STATE=$(adb -s $DEVICE shell dumpsys window | grep -E "mDreamingLockscreen=" | head -1)
            if echo "$STATE" | grep -q "mDreamingLockscreen=false"; then
              break
            fi
          done
          echo "lockscreen state after wait: $STATE"
          if echo "$STATE" | grep -q "mDreamingLockscreen=true"; then
            if [ -z "${ADB_PIN:-}" ]; then
              echo "ERROR: lockscreen up + no ADB_PIN secret. Aborting."
              exit 1
            fi
            echo "lockscreen still up — entering PIN"
            adb -s $DEVICE shell am broadcast -a android.intent.action.STOP_DREAM || true
            sleep 1
            echo "[pin] re-waking via KEYCODE_POWER"
            for _ in 1 2 3; do
              adb -s $DEVICE shell input keyevent KEYCODE_POWER || echo "[pin] POWER keyevent returned non-zero"
              sleep 1
              WAKE_STATE=$(adb -s $DEVICE shell dumpsys power | grep mWakefulness= | head -1)
              echo "[pin] wake state: $WAKE_STATE"
              if echo "$WAKE_STATE" | grep -q "Awake"; then break; fi
            done
            echo "[pin] swiping up (slow, full-height)"
            # Slower, longer swipe — keyguard sometimes ignores fast gestures.
            adb -s $DEVICE shell input swipe 500 2100 500 200 800 || echo "[pin] swipe returned non-zero"
            sleep 4
            # Screenshot the screen state BEFORE typing — if PIN keypad isn't
            # focused, this will show whatever screen IS focused.
            adb -s $DEVICE exec-out screencap -p > pre-pin.png 2>/dev/null || true
            ls -la pre-pin.png 2>/dev/null || true
            echo "[pin] entering ${#ADB_PIN}-digit PIN"
            # `input text` is blocked on Android 14+ secure keyguard — use
            # per-digit KEYCODE_<n> events.
            for (( i=0; i<${#ADB_PIN}; i++ )); do
              D="${ADB_PIN:$i:1}"
              adb -s $DEVICE shell input keyevent "KEYCODE_$D" || echo "[pin] digit $i keyevent returned non-zero"
              sleep 0.2
            done
            # 4-digit PINs auto-submit on Pixel; longer PINs need ENTER.
            if [ "${#ADB_PIN}" -gt 4 ]; then
              echo "[pin] sending ENTER"
              adb -s $DEVICE shell input keyevent KEYCODE_ENTER || echo "[pin] ENTER returned non-zero"
            fi
            sleep 3
            STATE=$(adb -s $DEVICE shell dumpsys window | grep -E "mDreamingLockscreen=" | head -1 || echo "(no state)")
            DREAM=$(adb -s $DEVICE shell dumpsys window | grep -E "mShowingDream=" | head -1 || echo "(no dream)")
            RESUMED=$(adb -s $DEVICE shell dumpsys activity activities | grep -m1 topResumedActivity || echo "(no resumed)")
            echo "[pin] after PIN: $STATE / $DREAM"
            echo "[pin] resumed: $RESUMED"
            if echo "$STATE" | grep -q "mDreamingLockscreen=true"; then
              echo "ERROR: PIN didn't dismiss lockscreen. Aborting."
              adb -s $DEVICE exec-out screencap -p > pin-debug.png 2>/dev/null || true
              ls -la pin-debug.png 2>/dev/null || true
              exit 1
            fi
            echo "[pin] lockscreen dismissed"
          fi

      - name: Install fresh debug APK (com.mettlelift.app.e2e)
        run: |
          set -eu
          DEVICE=100.69.203.52:5555
          APK=apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          # Every CI host generates its own ~/.android/debug.keystore, so an
          # install from this runner won't match the signature of whatever's
          # already on the phone (dev's local keystore, previous runner's
          # keystore, etc). Uninstall first to clear the signature mismatch;
          # this is a test phone so the per-app data loss is fine.
          adb -s $DEVICE uninstall com.mettlelift.app.e2e || true
          # -t allows test-only flag; -g pre-grants all dangerous perms.
          adb -s $DEVICE install -t -g "$APK"
          INSTALLED=$(adb -s $DEVICE shell dumpsys package com.mettlelift.app.e2e | awk -F= '/versionName=/{print $2; exit}')
          echo "Installed versionName: $INSTALLED"
          # `-g` on `adb install` skips POST_NOTIFICATIONS on Android 13+ (the
          # runtime model treats it as user-only). Explicitly grant every perm
          # the app requests so first launch doesn't pop a system dialog that
          # the preflight would mistake for a crash.
          for PERM in \
            android.permission.POST_NOTIFICATIONS \
            android.permission.CAMERA \
            android.permission.ACCESS_FINE_LOCATION \
            android.permission.ACCESS_COARSE_LOCATION \
            android.permission.ACCESS_BACKGROUND_LOCATION \
            android.permission.READ_MEDIA_IMAGES \
            android.permission.ACTIVITY_RECOGNITION \
            android.permission.BODY_SENSORS; do
            adb -s $DEVICE shell pm grant com.mettlelift.app.e2e "$PERM" || true
          done

      - name: Preflight — app launches without crashing
        run: |
          set -eu
          DEVICE=100.69.203.52:5555
          adb -s $DEVICE shell am force-stop com.mettlelift.app.e2e
          adb -s $DEVICE shell monkey -p com.mettlelift.app.e2e -c android.intent.category.LAUNCHER 1
          # Give React Native / Hermes time to lay out; then check the resumed activity.
          # If a permission dialog popped (despite the explicit pm grants),
          # dismiss it once and re-check — the dialog is proof the app is alive.
          sleep 6
          RESUMED=$(adb -s $DEVICE shell dumpsys activity activities | grep -m1 ResumedActivity | head -1)
          echo "Resumed (initial): $RESUMED"
          if echo "$RESUMED" | grep -q "permissioncontroller"; then
            adb -s $DEVICE shell input keyevent KEYCODE_BACK
            sleep 2
            RESUMED=$(adb -s $DEVICE shell dumpsys activity activities | grep -m1 ResumedActivity | head -1)
            echo "Resumed (after BACK): $RESUMED"
          fi
          if ! echo "$RESUMED" | grep -q "com.mettlelift.app.e2e"; then
            echo "ERROR: e2e app is not the resumed activity — launch likely crashed. Aborting nightly."
            exit 1
          fi

      - name: Save user's pre-run media volume
        id: save_state
        run: |
          DEVICE=100.69.203.52:5555
          # Capture STREAM_MUSIC (3) volume so we can restore the user's level
          # after the run. Nightly tests may play media, and we don't want to
          # wake the developer at 03:30.
          # Note: IronPulse (Expo app) does not use a LocaleManager with
          # SharedPreferences the way RadioShake does, so we skip the prefs-file
          # save/restore. Only the media volume needs preserving.
          VOL=$(adb -s $DEVICE shell settings get system volume_music 2>/dev/null | tr -d '\r')
          echo "Saved media volume before run: '$VOL'"
          echo "saved_volume=$VOL" >> "$GITHUB_OUTPUT"

      - name: Mute media stream for the duration of the run
        run: |
          DEVICE=100.69.203.52:5555
          # Set STREAM_MUSIC to 0. Touching only the media stream — ring and
          # notification streams stay at whatever the user set so phone calls
          # still ring during the run.
          adb -s $DEVICE shell cmd media_session volume --stream 3 --set 0 || \
            adb -s $DEVICE shell settings put system volume_music 0
          echo "Media volume after mute attempt:"
          adb -s $DEVICE shell cmd media_session volume --stream 3 --get || true

      - name: Run E2E flows against coexist build (com.mettlelift.app.e2e)
        id: e2e_main
        run: |
          set +e
          # The committed flow files use `appId: com.mettlelift.app` (the
          # shipping package). At run time we need to drive the .e2e coexist
          # build instead. Mirror the approach in apps/mobile/scripts/nightly-e2e.sh:
          # copy flows into a temp dir, then sed-rewrite the appId line in each
          # file (anchored to end-of-line so it never double-suffixes). The
          # committed flows are left untouched.
          RUN_DIR=/tmp/zor-e2e-run
          rm -rf "$RUN_DIR"; mkdir -p "$RUN_DIR"
          cp apps/mobile/e2e/*.yaml "$RUN_DIR"/
          sed -i 's/^appId: com\.mettlelift\.app$/appId: com.mettlelift.app.e2e/' "$RUN_DIR"/*.yaml

          PASS=0; FAIL=0; FAILED_FLOWS=""
          for flow in apps/mobile/e2e/*.yaml; do
            name=$(basename "$flow")
            tmp_flow="$RUN_DIR/$name"
            echo "::group::$name"
            adb -s 100.69.203.52:5555 shell am force-stop com.mettlelift.app.e2e
            maestro --device 100.69.203.52:5555 test "$tmp_flow"
            if [ $? -eq 0 ]; then PASS=$((PASS+1)); else FAIL=$((FAIL+1)); FAILED_FLOWS="$FAILED_FLOWS $name"; fi
            echo "::endgroup::"
          done
          echo "e2e_pass=$PASS" >> "$GITHUB_OUTPUT"
          echo "e2e_fail=$FAIL" >> "$GITHUB_OUTPUT"
          echo "e2e_failed_flows=$FAILED_FLOWS" >> "$GITHUB_OUTPUT"

      - name: Run smoke flows against shipping build (com.mettlelift.app)
        id: e2e_smoke
        run: |
          set +e
          # Smoke flows are committed against com.mettlelift.app (the shipping
          # build) directly — no appId rewrite needed. This validates the literal
          # store artifact boots + authenticates on the real device.
          # The shipping build must already be installed by the developer (Play
          # release channel) — CI does not build it. Skip if absent so the
          # nightly still reports coexist e2e results.
          if ! adb -s 100.69.203.52:5555 shell pm list packages | grep -q '^package:com.mettlelift.app$'; then
            echo "::warning::com.mettlelift.app (shipping build) not installed — skipping smoke flows."
            echo "smoke_pass=0" >> "$GITHUB_OUTPUT"
            echo "smoke_fail=0" >> "$GITHUB_OUTPUT"
            echo "smoke_failed_flows=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          PASS=0; FAIL=0; FAILED_FLOWS=""
          for flow in apps/mobile/e2e-smoke/*.yaml; do
            name=$(basename "$flow")
            echo "::group::smoke/$name"
            adb -s 100.69.203.52:5555 shell am force-stop com.mettlelift.app
            maestro --device 100.69.203.52:5555 test "$flow"
            if [ $? -eq 0 ]; then PASS=$((PASS+1)); else FAIL=$((FAIL+1)); FAILED_FLOWS="$FAILED_FLOWS $name"; fi
            echo "::endgroup::"
          done
          echo "smoke_pass=$PASS" >> "$GITHUB_OUTPUT"
          echo "smoke_fail=$FAIL" >> "$GITHUB_OUTPUT"
          echo "smoke_failed_flows=$FAILED_FLOWS" >> "$GITHUB_OUTPUT"

      - name: Restore user's pre-run media volume
        if: always()
        run: |
          DEVICE=100.69.203.52:5555
          SAVED_VOL='${{ steps.save_state.outputs.saved_volume }}'
          if [ -n "$SAVED_VOL" ]; then
            adb -s $DEVICE shell cmd media_session volume --stream 3 --set "$SAVED_VOL" || \
              adb -s $DEVICE shell settings put system volume_music "$SAVED_VOL" || true
            echo "Restored media volume to: $SAVED_VOL"
          fi

      - name: Restore device state
        if: always()
        run: |
          DEVICE=100.69.203.52:5555
          # Re-enable screensaver and allow display to sleep
          adb -s $DEVICE shell settings put secure screensaver_enabled 1 || true
          adb -s $DEVICE shell svc power stayon false || true
          # Restore default 30-second screen-off timeout (we pushed it to
          # 30min in the wake step to survive PIN entry).
          adb -s $DEVICE shell settings put system screen_off_timeout 30000 || true
          # Maestro's setOrientation turns auto-rotate off to pin the rotation
          # and never turns it back on, so a flow that rotates leaves this phone
          # — the owner's daily driver — stuck in whatever orientation it ended
          # in. Restore auto-rotate here rather than relying on flows to reset it.
          adb -s $DEVICE shell settings put system accelerometer_rotation 1 || true
          adb -s $DEVICE shell input keyevent KEYCODE_SLEEP || true

      - name: Release shared Pixel lock
        if: always()
        run: |
          if [ -f /tmp/pixel-e2e-lock/owner ] \
             && [ "$(cat /tmp/pixel-e2e-lock/owner 2>/dev/null)" = "zor" ]; then
            rm -rf /tmp/pixel-e2e-lock
            echo "released /tmp/pixel-e2e-lock"
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: maestro-results
          path: |
            pre-pin.png
            pin-debug.png
          if-no-files-found: warn

      - name: Publish results to e2e.hiten-patel.co.uk
        if: always()
        env:
          E2E_INGEST_TOKEN: ${{ secrets.E2E_INGEST_TOKEN }}
          E2E_PASS: ${{ steps.e2e_main.outputs.e2e_pass }}
          E2E_FAIL: ${{ steps.e2e_main.outputs.e2e_fail }}
          E2E_FAILED_FLOWS: ${{ steps.e2e_main.outputs.e2e_failed_flows }}
          SMOKE_PASS: ${{ steps.e2e_smoke.outputs.smoke_pass }}
          SMOKE_FAIL: ${{ steps.e2e_smoke.outputs.smoke_fail }}
          SMOKE_FAILED_FLOWS: ${{ steps.e2e_smoke.outputs.smoke_failed_flows }}
          RUN_ID: ${{ github.run_number }}
        run: |
          if [ -z "$E2E_INGEST_TOKEN" ]; then
            echo "E2E_INGEST_TOKEN not configured — skipping dashboard publish"
            exit 0
          fi
          export COMMIT_MSG=$(git log -1 --pretty=%s | head -c 280)
          python3 - <<'PY' || true
          import json, os, urllib.request
          def tier(name, pass_var, fail_var, flows_var):
              p = int(os.environ.get(pass_var, "0") or 0)
              f = int(os.environ.get(fail_var, "0") or 0)
              flows = (os.environ.get(flows_var) or "").split()
              return {"name": name, "passed": p, "failed": f, "total": p + f, "failed_flows": flows}
          device_unreachable = os.environ.get("DEVICE_UNREACHABLE") == "1"
          payload = {
              "project": "zor",
              "status": "device_unreachable" if device_unreachable else "completed",
              "commit_sha": os.environ.get("GITHUB_SHA", ""),
              "commit_message": os.environ.get("COMMIT_MSG") or "",
              "workflow": "maestro-nightly",
              "run_url": f"https://git.hiten-patel.co.uk/hiten/IronPulse/actions/runs/{os.environ.get('RUN_ID','')}",
              "tiers": [
                  tier("e2e", "E2E_PASS", "E2E_FAIL", "E2E_FAILED_FLOWS"),
                  tier("e2e-smoke", "SMOKE_PASS", "SMOKE_FAIL", "SMOKE_FAILED_FLOWS"),
              ],
          }
          req = urllib.request.Request(
              "https://e2e.hiten-patel.co.uk/v1/runs",
              data=json.dumps(payload).encode(),
              headers={
                  "Authorization": f"Bearer {os.environ['E2E_INGEST_TOKEN']}",
                  "Content-Type": "application/json",
              },
              method="POST",
          )
          with urllib.request.urlopen(req, timeout=15) as resp:
              print("dashboard:", resp.status, resp.read().decode())
          PY

      # Must be the last step: everything above (artifact upload, device
      # cleanup, dashboard publish) is `if: always()` and has already run.
      # The flow steps count failures instead of propagating them, so without
      # this the run reports success with flows failing — which also makes the
      # `changes` skip-gate treat a red tree as the last green nightly and skip
      # re-testing it until an unrelated commit lands.
      - name: Fail the run if any flow failed
        if: always()
        env:
          E2E_FAIL: ${{ steps.e2e_main.outputs.e2e_fail }}
          SMOKE_FAIL: ${{ steps.e2e_smoke.outputs.smoke_fail }}
          E2E_PASS: ${{ steps.e2e_main.outputs.e2e_pass }}
          SMOKE_PASS: ${{ steps.e2e_smoke.outputs.smoke_pass }}
          E2E_FLOWS: ${{ steps.e2e_main.outputs.e2e_failed_flows }}
          SMOKE_FLOWS: ${{ steps.e2e_smoke.outputs.smoke_failed_flows }}
        run: |
          set -eu
          if [ "${DEVICE_UNREACHABLE:-}" = "1" ]; then
            echo "::error::Device was unreachable — no flows ran."
            exit 1
          fi
          TOTAL=$(( ${E2E_FAIL:-0} + ${SMOKE_FAIL:-0} ))
          RAN=$(( ${E2E_PASS:-0} + ${SMOKE_PASS:-0} + TOTAL ))
          if [ "$RAN" -eq 0 ]; then
            echo "::error::No Maestro flows ran — an earlier step aborted the job."
            exit 1
          fi
          if [ "$TOTAL" -gt 0 ]; then
            echo "::error::$TOTAL Maestro flow(s) failed:${E2E_FLOWS:-}${SMOKE_FLOWS:-}"
            exit 1
          fi
          echo "All Maestro flows passed (${E2E_PASS:-0} e2e + ${SMOKE_PASS:-0} smoke)."
