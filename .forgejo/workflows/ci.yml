name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NEXTAUTH_SECRET: ci-test-secret-do-not-use-in-production
  NEXTAUTH_URL: http://localhost:3000

jobs:
  lint-and-typecheck:
    runs-on: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - name: Audit dependencies
        run: pnpm audit --audit-level=high
        continue-on-error: true

  test-unit:
    name: Unit Tests (shared + sync)
    runs-on: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run shared package tests
        run: pnpm --filter @zor/shared test
      - name: Run sync package tests
        run: pnpm --filter @zor/sync test

  test-api:
    name: API Tests (real PostgreSQL)
    runs-on: arm64
    services:
      postgres:
        image: imresamu/postgis:16-3.4-alpine  # multi-arch (has arm64, unlike upstream postgis/postgis)
        env:
          POSTGRES_USER: ironpulse
          POSTGRES_PASSWORD: ironpulse
          POSTGRES_DB: ironpulse_test
        options: >-
          --health-cmd "pg_isready -U ironpulse"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ironpulse:ironpulse@postgres:5432/ironpulse_test
      REDIS_URL: redis://redis:6379
      STRIPE_SECRET_KEY: sk_test_dummy_for_ci_do_not_use
      STRIPE_WEBHOOK_SECRET: whsec_test_dummy_for_ci
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Wait for PostgreSQL to accept connections
        # The job runs in a node container with no postgresql-client, so
        # pg_isready isn't available. Probe TCP with Node instead — a successful
        # connect to 5432 means the real server is listening (the postgres
        # image's first-boot temp server uses a unix socket only, not TCP).
        run: |
          probe() { node -e "const s=require('net').connect(5432,'postgres');s.on('connect',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1));s.setTimeout(2000,()=>process.exit(1));"; }
          for i in $(seq 1 30); do
            if probe; then echo "PostgreSQL ready after ${i} probes"; break; fi
            echo "Waiting for PostgreSQL... ($i/30)"
            sleep 2
          done
          probe || { echo "PostgreSQL never became ready"; exit 1; }
      - name: Push database schema
        run: |
          for attempt in 1 2 3 4 5; do
            if pnpm --filter @zor/db db:push; then
              exit 0
            fi
            echo "db:push failed (attempt $attempt/5), retrying in $((attempt * 5))s..."
            [ "$attempt" -lt 5 ] && sleep $((attempt * 5))
          done
          exit 1
      - name: Run API tests
        run: pnpm --filter @zor/api test

  build:
    runs-on: arm64
    needs: [lint-and-typecheck, test-unit]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Next.js cache
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/src/**') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            nextjs-${{ runner.os }}-
      - name: Build web app
        run: pnpm --filter @zor/web build
      - name: Trim web build for artifact
        # Forgejo's artifact backend chokes on multi-GB uploads; the raw
        # .next tree is ~1.7 GB, dominated by .next/cache (1.4 GB — a
        # per-machine incremental build cache, useless to other jobs) and
        # .next/standalone/node_modules (~150 MB — recreated by downstream
        # jobs' own pnpm install). Trim both before upload; keeps the
        # artifact around ~70 MB, well within tolerated size.
        run: |
          rm -rf apps/web/.next/cache
          rm -rf apps/web/.next/standalone/node_modules
      - name: Upload web build
        uses: actions/upload-artifact@v3
        with:
          name: web-build
          path: |
            apps/web/.next
            apps/web/public
          retention-days: 1
          include-hidden-files: true

  # ── Lighthouse CI: web performance + a11y budgets ──
  lighthouse:
    name: Lighthouse CI
    runs-on: arm64
    needs: [build]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download web build
        uses: actions/download-artifact@v3
        with:
          name: web-build
          path: apps/web
      - name: Run Lighthouse CI
        run: |
          # Run lighthouse against locally-served build
          pnpm --filter @zor/web exec lhci autorun --config=../../lighthouserc.json || echo "Lighthouse assertions failed (advisory)"
      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: lighthouse-report
          path: |
            apps/web/.lighthouseci/
            .lighthouseci/
          retention-days: 7

  # ── Playwright E2E with a11y (axe-core) ──
  e2e-web:
    name: Web E2E + a11y (Playwright)
    runs-on: arm64
    needs: [build]
    services:
      postgres:
        image: imresamu/postgis:16-3.4-alpine  # multi-arch (has arm64, unlike upstream)
        env:
          POSTGRES_USER: ironpulse
          POSTGRES_PASSWORD: ironpulse
          POSTGRES_DB: ironpulse_test
        options: >-
          --health-cmd "pg_isready -U ironpulse"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ironpulse:ironpulse@postgres:5432/ironpulse_test
      REDIS_URL: redis://redis:6379
      STRIPE_SECRET_KEY: sk_test_dummy_for_ci_do_not_use
      STRIPE_WEBHOOK_SECRET: whsec_test_dummy_for_ci
      GOOGLE_CLIENT_ID: dummy-google-client-id-for-ci
      GOOGLE_CLIENT_SECRET: dummy-google-client-secret-for-ci
      APPLE_ID: dummy-apple-id-for-ci
      APPLE_SECRET: dummy-apple-secret-for-ci
      RATE_LIMIT_API_MAX: "10000"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Push schema and seed
        run: |
          pnpm --filter @zor/db db:push
          # No '|| true' — exercise seed must succeed or seed:dev produces a
          # workout-less DB and the trpc-fallback / workout specs all fail.
          pnpm --filter @zor/db db:seed
          # E2E specs sign in as athlete@test.com (and other test tier users)
          # which only seed-dev creates. Without this the signIn helper times
          # out at /login on every spec.
          pnpm --filter @zor/db db:seed:dev
      - name: Install Playwright browsers
        run: pnpm --filter @zor/web exec playwright install --with-deps chromium
      - name: Download web build
        uses: actions/download-artifact@v3
        with:
          name: web-build
          path: apps/web
      - name: Start API server
        # next.config.ts sets output: "standalone", which means `next start`
        # silently no-ops (Next prints a warning then never accepts requests).
        # Run the standalone server.js entry directly, after staging the
        # static + public dirs that the bundle expects to find next to it.
        run: |
          set -x
          STANDALONE=apps/web/.next/standalone/apps/web
          ls "$STANDALONE" || true
          cp -r apps/web/.next/static "$STANDALONE/.next/static"
          cp -r apps/web/public "$STANDALONE/public"
          HOSTNAME=0.0.0.0 PORT=3000 nohup node "$STANDALONE/server.js" > /tmp/web-server.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/api/health > /dev/null 2>&1; then echo "Ready"; break; fi
            sleep 2
          done
          echo "--- web-server.log (post-wait) ---"
          cat /tmp/web-server.log || true
          echo "--- end ---"
          curl -sv http://localhost:3000/api/health 2>&1 | head -20 || true
      - name: Run Playwright tests
        run: pnpm --filter @zor/web test:e2e
        env:
          BASE_URL: http://localhost:3000
      - name: Dump web server log on failure
        if: failure()
        run: |
          echo "=== /tmp/web-server.log ==="
          cat /tmp/web-server.log || echo "(no log)"
          echo "=== end ==="
      - uses: actions/upload-artifact@v3
        if: always()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  # Multi-arch image: one native build per architecture, then a manifest
  # merge. Emulating amd64 under QEMU on the arm64 host does not work — pnpm
  # crashes on Ubuntu's qemu 8.2 and `next build` (SWC) SIGSEGVs on qemu 10.
  build-image-amd64:
    name: Build Image (amd64)
    # NAS x86_64 runner (label amd64-dind). Two NAS constraints shape this job:
    #  - kernel 4.4 has no overlayfs, so a buildx docker-container builder
    #    falls back to the "native" snapshotter (full copy per layer) and a
    #    single FROM took 47 min. The daemon's own BuildKit uses the aufs
    #    graphdriver and is fast, so the build runs through the mounted
    #    docker socket with plain `docker build`.
    #  - the daemon cannot push to git.hiten-patel.co.uk: the NAS resolves it
    #    to the public IP and the router NAT hairpin drops large uploads
    #    (HTTP 499 mid-layer). A socat container (forgejo-registry-proxy)
    #    publishes 127.0.0.1:3000 on the NAS host and forwards to
    #    forgejo:3000; 127.0.0.0/8 is an insecure registry by default, so the
    #    daemon pushes over plain HTTP without daemon.json changes (no root on
    #    the NAS). Same registry, same repo, so the merge job references the
    #    tag by the public name.
    runs-on: amd64-dind
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    needs: [ci-gate]
    env:
      REG: 127.0.0.1:3000/hiten/mettlelift
    steps:
      - uses: actions/checkout@v4
      - name: Loopback proxy to the Forgejo registry
        run: |
          if ! docker ps --format '{{.Names}}' | grep -qx forgejo-registry-proxy; then
            docker rm -f forgejo-registry-proxy 2>/dev/null || true
            docker run -d --restart unless-stopped --name forgejo-registry-proxy \
              --network home-server_frontend -p 127.0.0.1:3000:3000 \
              alpine/socat tcp-listen:3000,fork,reuseaddr tcp:forgejo:3000
          fi
      - name: Registry login
        run: echo "$REGISTRY_TOKEN" | docker login 127.0.0.1:3000 -u "$REGISTRY_USER" --password-stdin
        env:
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
      - name: Build (daemon BuildKit, aufs)
        # buildcache-amd64 is the previous image with inline cache metadata;
        # the daemon's local build cache covers the common case anyway.
        run: |
          docker pull "$REG:buildcache-amd64" || true
          DOCKER_BUILDKIT=1 docker build --progress=plain -f docker/Dockerfile \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            --build-arg BUILD_SHA=${{ github.sha }} \
            --build-arg SKIP_TYPECHECK_ON_BUILD=1 \
            --cache-from "$REG:buildcache-amd64" \
            -t "$REG:sha-${{ github.sha }}-amd64" -t "$REG:buildcache-amd64" .
      - name: Push
        run: |
          docker push "$REG:sha-${{ github.sha }}-amd64"
          docker push "$REG:buildcache-amd64"
      - name: Prune old local tags
        # Keep buildcache-amd64 (layer cache); drop per-sha tags and dangling
        # layers so the 2 GB images do not pile up on the NAS.
        if: always()
        run: |
          docker images --format '{{.Repository}}:{{.Tag}}' "$REG" \
            | grep ':sha-' | grep -v "sha-${{ github.sha }}-amd64" \
            | xargs -r docker rmi >/dev/null 2>&1 || true
          docker image prune -f >/dev/null 2>&1 || true

  build-image-arm64:
    name: Build Image (arm64)
    runs-on: arm64-dind
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    needs: [ci-gate]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: git.hiten-patel.co.uk
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_TOKEN }}
      # Image push and cache export are two steps on purpose: in one step
      # buildkit uploads the image layers and the cache layers concurrently,
      # and the two streams carry the same blobs. Forgejo's registry races on
      # concurrent uploads of one digest ("offset mismatch between file and
      # model", HTTP 500). The second step is a full cache hit, so it only
      # writes the cache manifest plus any blob the first step did not.
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/arm64
          push: true
          provenance: false
          build-args: |
            BUILD_SHA=${{ github.sha }}
            SKIP_TYPECHECK_ON_BUILD=1
          tags: git.hiten-patel.co.uk/hiten/mettlelift:sha-${{ github.sha }}-arm64
          cache-from: type=registry,ref=git.hiten-patel.co.uk/hiten/mettlelift:buildcache-arm64
      - name: Export build cache
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/arm64
          push: false
          provenance: false
          build-args: |
            BUILD_SHA=${{ github.sha }}
            SKIP_TYPECHECK_ON_BUILD=1
          cache-from: type=registry,ref=git.hiten-patel.co.uk/hiten/mettlelift:buildcache-arm64
          cache-to: type=registry,ref=git.hiten-patel.co.uk/hiten/mettlelift:buildcache-arm64,mode=max

  build-image:
    name: Publish Multi-arch Image
    runs-on: arm64-dind
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    needs: [build-image-amd64, build-image-arm64]
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: git.hiten-patel.co.uk
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_TOKEN }}
      - name: Merge per-arch manifests
        run: |
          # main pushes tag both prod-<sha> and staging-<sha> so the Manual
          # Deploy workflow can soak a main commit on staging before prod.
          IMG=git.hiten-patel.co.uk/hiten/mettlelift
          SHA=${{ github.sha }}
          TAGS=(-t "$IMG:staging-$SHA")
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            TAGS+=(-t "$IMG:prod-$SHA")
          fi
          docker buildx imagetools create "${TAGS[@]}" "$IMG:sha-$SHA-amd64" "$IMG:sha-$SHA-arm64"
          docker buildx imagetools inspect "$IMG:staging-$SHA" | grep -E 'Platform:' | tee /dev/stderr | grep -q 'linux/amd64'
          docker buildx imagetools inspect "$IMG:staging-$SHA" | grep -q 'linux/arm64'

  deploy-staging:
    name: Deploy Staging
    runs-on: arm64
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: [build-image]
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.STAGING_SSH_KEY }}" > ~/.ssh/staging && chmod 600 ~/.ssh/staging
          ssh-keyscan -p ${{ secrets.STAGING_SSH_PORT }} ${{ secrets.STAGING_SSH_HOST }} >> ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts || { echo "ERROR: ssh-keyscan produced empty known_hosts — aborting"; exit 1; }
      - name: Deploy
        run: |
          TAG=staging-${{ github.sha }}
          SSH="ssh -i ~/.ssh/staging -p ${{ secrets.STAGING_SSH_PORT }} ${{ secrets.STAGING_SSH_USER }}@${{ secrets.STAGING_SSH_HOST }}"
          DIR=${{ secrets.STAGING_COMPOSE_DIR }}   # repo clone root on the NAS
          $SSH "cd '$DIR' && git pull --ff-only && cd docker && flock /tmp/mettlelift-deploy.lock sh remote-deploy.sh staging $TAG"
      - name: Smoke test
        run: |
          for i in $(seq 1 20); do
            if node scripts/smoke/check-health.mjs https://staging.mettlelift.hiten-patel.co.uk ${{ github.sha }}; then exit 0; fi
            echo "attempt $i/20 failed; retrying in 6s"
            sleep 6
          done
          echo "smoke failed after 20 attempts"
          exit 1
      - name: Login + write-path smoke (Playwright)
        if: ${{ secrets.STAGING_TEST_USER_PASSWORD != '' }}
        run: |
          # pnpm setup mirrors other jobs
          corepack enable
          pnpm install --frozen-lockfile
          pnpm --filter @zor/web exec playwright install --with-deps chromium
          BASE_URL=https://staging.mettlelift.hiten-patel.co.uk pnpm --filter @zor/web exec playwright test e2e/auth-login.spec.ts e2e/goals.spec.ts
        env:
          TEST_USER_PASSWORD: ${{ secrets.STAGING_TEST_USER_PASSWORD }}

  ci-gate:
    name: CI Gate
    runs-on: arm64
    if: always()
    needs: [build, test-api, e2e-web]
    steps:
      - name: Check all required jobs
        run: |
          echo "build: ${{ needs.build.result }}"
          echo "test-api: ${{ needs.test-api.result }}"
          echo "e2e-web: ${{ needs.e2e-web.result }}"
          for r in "${{ needs.build.result }}" "${{ needs.test-api.result }}" "${{ needs.e2e-web.result }}"; do
            if [[ "$r" != "success" ]]; then echo "required job failed — blocking"; exit 1; fi
          done

