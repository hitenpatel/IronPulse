http:
  middlewares:
    sablier-mettlelift:
      plugin:
        sablier:
          sablierUrl: http://mettlelift-sablier:10000
          group: mettlelift-dev
          sessionDuration: 10m
          dynamic:
            displayName: Mettle Lift Dev
            theme: ghost
            refreshFrequency: 5s
            showDetails: true

  routers:
    mettlelift:
      rule: "PathPrefix(`/`)"
      entryPoints:
        - web
      middlewares:
        - sablier-mettlelift
      service: mettlelift-app

  services:
    mettlelift-app:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:3000"
        passHostHeader: true

  serversTransports:
    default:
      forwardingTimeouts:
        dialTimeout: "30s"
        responseHeaderTimeout: "0s"
        idleConnTimeout: "90s"
