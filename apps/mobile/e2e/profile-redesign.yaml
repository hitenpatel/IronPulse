appId: com.ironpulse.app
---
# QA for #221 — Profile redesign. Asserts the hero + grouped nav
# sections + danger zone are all reachable.
#
# Re-derived against current app/(tabs)/profile.tsx:
# - Hero shows "Level {n}" as one Chip (not bare "Level"), plus the
#   Workouts/PRs/Hours stat strip.
# - Section headers render via UppercaseLabel, which is CSS-only
#   textTransform:"uppercase" — the underlying accessible text is the raw
#   `section.title` string ("Communication", "Training", ... "App"), NOT the
#   all-caps rendering. Same for "Danger zone" (only first word capitalised).
# - The screen has grown a lot (Communication + Training x7 + Recovery +
#   Social x4 + Data + App + biometric toggle + danger zone + sign out) so a
#   fixed swipe count is unreliable — scrollUntilVisible instead.

- launchApp
- tapOn: "Profile"

- assertVisible: "Level .*"
- assertVisible: "Workouts"
- assertVisible: "PRs"
- assertVisible: "Hours"

# Nav sections (raw case — see note above)
- assertVisible: "Communication"
- assertVisible: "Training"
- assertVisible: "Recovery"

# Scroll down to reach the Data / App / Danger zone
- scrollUntilVisible:
    element:
      text: "Data"
    direction: DOWN
    timeout: 15000
- assertVisible: "Data"
- assertVisible: "App"

- scrollUntilVisible:
    element:
      id: "sign-out-button"
    direction: DOWN
    timeout: 15000
- assertVisible:
    id: "sign-out-button"
- assertVisible: "Danger zone"
