appId: com.ironpulse.app
---
# NEEDS HUMAN DECISION (TASK-19 e2e rewrite, 2026-09-07):
# Same root cause as body-fat-log.yaml — the body-weight logging UI this flow
# exercises (testIDs "weight-input" / "log-weight") no longer exists anywhere
# in the app. The redesigned Stats screen (app/(tabs)/stats.tsx) has no such
# fields, and a repo-wide grep turns up nothing except the unrelated
# "Body weight" GOAL TYPE in app/goals/index.tsx. Left as-is (still broken)
# pending a human decision on whether to delete this flow or rebuild the
# feature — not deleted per TASK-19 instructions.
- launchApp:
    clearKeychain: true
    clearState: true
- extendedWaitUntil:
    visible:
      id: "email-input"
    timeout: 60000
- tapOn:
    id: "email-input"
- inputText: "test@example.com"
- tapOn:
    id: "password-input"
- inputText: "password123"
- tapOn:
    id: "login-button"
- extendedWaitUntil:
    visible:
      id: "greeting"
    timeout: 60000
- waitForAnimationToEnd
- tapOn: "Stats"
- extendedWaitUntil:
    visible:
      id: "weight-input"
    timeout: 10000
- tapOn:
    id: "weight-input"
- inputText: "75.5"
- tapOn:
    id: "log-weight"
- extendedWaitUntil:
    visible: "75.5"
    timeout: 10000
