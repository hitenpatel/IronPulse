appId: com.ironpulse.app
---
- launchApp:
    clearKeychain: true
    clearState: true
- extendedWaitUntil:
    visible:
      id: "email-input"
    timeout: 60000
- tapOn:
    id: "email-input"
- inputText: "test@example.com"
- tapOn:
    id: "password-input"
- inputText: "password123"
- tapOn:
    id: "login-button"
- extendedWaitUntil:
    visible:
      id: "greeting"
    timeout: 60000
- waitForAnimationToEnd
- tapOn: "Profile"
- waitForAnimationToEnd
# Sleep is in the Recovery section, below Communication + Training x7 —
# scroll until the row is visible.
- scrollUntilVisible:
    element:
      text: "Sleep"
    direction: DOWN
    timeout: 15000
- tapOn: "Sleep"
# "Last night" hero always renders — a reliable, data-independent landmark.
- extendedWaitUntil:
    visible: "Last night"
    timeout: 10000
# Quality options (Poor/Fair/Good/Excellent) only render once the log form is
# open (app/sleep/index.tsx `formOpen` state, default false) — the "+"
# toggle's accessibilityLabel is "Log sleep" (raw case).
- tapOn: "Log sleep"
- assertVisible: "Poor"
- assertVisible: "Fair"
- assertVisible: "Good"
- assertVisible: "Excellent"
# There is no "Recent Sleep" heading — "Quality" is the real label directly
# above these options, and confirms the form rendered correctly.
- assertVisible: "Quality"
