appId: com.ironpulse.app
---
# Verify biometric button appears on login screen when available
# Note: actual biometric prompt cannot be triggered in CI — this test
# verifies the button renders when biometric is enrolled
- launchApp:
    clearKeychain: true
    clearState: true
- extendedWaitUntil:
    visible:
      id: "email-input"
    timeout: 60000
# Sign in first to enroll biometric credentials
- tapOn:
    id: "email-input"
- inputText: "test@example.com"
- tapOn:
    id: "password-input"
- inputText: "password123"
- tapOn:
    id: "login-button"
- extendedWaitUntil:
    visible:
      id: "greeting"
    timeout: 60000
# Sign out and verify login screen loads
- waitForAnimationToEnd
- tapOn: "Profile"
- waitForAnimationToEnd
# Sign out is below every menu section — this flow previously had no
# scrolling at all, so "Sign out" was never actually on screen. Scroll to
# the button (testID "sign-out-button") before waiting for/tapping it.
- scrollUntilVisible:
    element:
      id: "sign-out-button"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "sign-out-button"
- extendedWaitUntil:
    visible:
      id: "email-input"
    timeout: 60000
- assertVisible:
    id: "login-button"
