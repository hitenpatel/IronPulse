appId: com.ironpulse.app
---
- launchApp:
    clearKeychain: true
    clearState: true
- extendedWaitUntil:
    visible:
      id: "email-input"
    timeout: 60000
- tapOn:
    id: "email-input"
- inputText: "test@example.com"
- tapOn:
    id: "password-input"
- inputText: "password123"
- tapOn:
    id: "login-button"
- extendedWaitUntil:
    visible:
      id: "greeting"
    timeout: 60000
- waitForAnimationToEnd
# The Profile row that used to say "Workout History" is now "Records"
# (app/(tabs)/profile.tsx), but the Dashboard's "Recent" section has its own
# unconditional "View all" link straight to the same HistoryWorkouts screen
# (app/(tabs)/index.tsx) — a more direct entry point than drilling into
# Profile, so use that instead.
- scrollUntilVisible:
    element:
      text: "View all"
    direction: DOWN
    timeout: 15000
- tapOn: "View all"
- extendedWaitUntil:
    visible: "Workouts"
    timeout: 10000
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "No workouts yet"
    commands:
      - assertVisible: "No workouts yet"
- runFlow:
    when:
      notVisible: "No workouts yet"
    commands:
      - tapOn:
          index: 0
      - extendedWaitUntil:
          visible: "Duration"
          timeout: 10000
      - assertVisible: "Volume"
      - assertVisible: "Exercises"
