appId: com.ironpulse.app
---
- launchApp:
    clearKeychain: true
    clearState: true
- extendedWaitUntil:
    visible:
      id: "email-input"
    timeout: 60000
- tapOn:
    id: "email-input"
- inputText: "test@example.com"
- tapOn:
    id: "password-input"
- inputText: "password123"
- tapOn:
    id: "login-button"
- extendedWaitUntil:
    visible:
      id: "greeting"
    timeout: 60000
- waitForAnimationToEnd
- tapOn: "Exercises"
- waitForAnimationToEnd
- assertVisible:
    id: "exercises-heading"
# The old `tapOn: {index: 0, text: ".*"}` was too fragile — with the
# TopBar/search/filter chips also rendering text, index 0 doesn't reliably
# land on the first exercise row and the screen never actually navigates.
# Search for a known exercise by name (same idiom as workout-empty.yaml)
# and tap its row directly instead.
# "Barbell Bench Press - Medium Grip" is the exact seeded name (see
# packages/db/scripts/reset-mobile-e2e-utils.ts REQUIRED_EXERCISE_NAMES) —
# there is no exercise literally named "Bench Press".
- tapOn:
    id: "exercises-search-input"
- inputText: "Barbell Bench Press"
- extendedWaitUntil:
    visible: "Barbell Bench Press - Medium Grip"
    timeout: 10000
- tapOn: "Barbell Bench Press - Medium Grip"
- extendedWaitUntil:
    visible: "Personal Records"
    timeout: 10000
- assertVisible: "Recent Sets"
