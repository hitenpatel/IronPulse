appId: com.ironpulse.app
---
- launchApp:
    clearKeychain: true
    clearState: true
- extendedWaitUntil:
    visible:
      id: "email-input"
    timeout: 60000
- tapOn:
    id: "email-input"
- inputText: "test@example.com"
- tapOn:
    id: "password-input"
- inputText: "password123"
- tapOn:
    id: "login-button"
- extendedWaitUntil:
    visible:
      id: "greeting"
    timeout: 60000
- waitForAnimationToEnd
- tapOn:
    id: "fab-button"
- extendedWaitUntil:
    visible: "Start Workout"
    timeout: 10000
- tapOn: "Start Workout"
- extendedWaitUntil:
    visible: "Empty Workout"
    timeout: 10000
- tapOn: "Empty Workout"
- extendedWaitUntil:
    visible: "Finish"
    timeout: 10000
- waitForAnimationToEnd
# The header Cancel control (components/workout/workout-session-header.tsx)
# is now an icon-only X button — it has no visible "Cancel" text, only
# accessibilityLabel "Cancel workout" (added testID "cancel-workout-button").
# There is also no "Discard" text anywhere: confirming discards a native
# Alert.alert("Cancel Workout", "Are you sure? All data will be lost.", ...)
# with buttons "Keep Going" / "Cancel Workout" (destructive) — see
# hooks/use-active-workout-session.ts handleCancel. The dialog title and the
# destructive button share the exact same text, so disambiguate by index
# (title renders first, the tappable button second).
- tapOn:
    id: "cancel-workout-button"
- extendedWaitUntil:
    visible: "Cancel Workout"
    timeout: 10000
- tapOn:
    text: "Cancel Workout"
    index: 1
- extendedWaitUntil:
    visible:
      id: "greeting"
    timeout: 60000
