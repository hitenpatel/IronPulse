appId: com.mettlelift.app
---
- launchApp:
    clearKeychain: true
    clearState: true
- extendedWaitUntil:
    visible:
      id: "email-input"
    timeout: 60000
- tapOn:
    id: "email-input"
- inputText: "test@example.com"
- tapOn:
    id: "password-input"
- inputText: "password123"
- tapOn:
    id: "login-button"
- extendedWaitUntil:
    visible:
      id: "greeting"
    timeout: 60000
- waitForAnimationToEnd
# Messages lives in the Communication section of the Profile menu.
- tapOn: "Profile"
- waitForAnimationToEnd
- tapOn: "Messages"
- extendedWaitUntil:
    visible: "Messages"
    timeout: 10000
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "No messages yet"
    commands:
      - assertVisible: "No messages yet"
- runFlow:
    when:
      notVisible: "No messages yet"
    commands:
      - assertVisible: "Messages"
