appId: com.ironpulse.app
---
- launchApp:
    clearKeychain: true
    clearState: true
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "email-input"
    timeout: 60000
- tapOn:
    id: "email-input"
- inputText: "test@example.com"
- tapOn:
    id: "password-input"
- inputText: "password123"
- tapOn:
    id: "login-button"
- extendedWaitUntil:
    visible:
      id: "greeting"
    timeout: 60000
- tapOn:
    id: "fab-button"
- extendedWaitUntil:
    visible: "Start Cardio"
    timeout: 10000
- tapOn: "Start Cardio"
- extendedWaitUntil:
    visible: "Run"
    timeout: 10000
- tapOn: "Run"
# Tapping an activity moves to the "How do you want to log your run?" step,
# which has its own in-screen "Back" link — but that only clears the
# selected type and stays on this screen. The actual exit-to-dashboard
# control is the X close button in the header (app/cardio/type-picker.tsx),
# which previously had no testID; added testID="cardio-picker-close" there.
- extendedWaitUntil:
    visible: "Track with GPS"
    timeout: 10000
- tapOn:
    id: "cardio-picker-close"
- extendedWaitUntil:
    visible:
      id: "greeting"
    timeout: 60000
