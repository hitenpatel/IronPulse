appId: com.ironpulse.app
---
- launchApp:
    clearKeychain: true
    clearState: true
- extendedWaitUntil:
    visible:
      id: "email-input"
    timeout: 60000
- tapOn:
    id: "forgot-password-link"
- extendedWaitUntil:
    visible:
      id: "forgot-email-input"
    timeout: 10000
- tapOn:
    id: "forgot-email-input"
- inputText: "test@example.com"
- tapOn:
    id: "forgot-submit-button"
# Full sentence in app/(auth)/forgot-password.tsx is "If an account exists
# with that email, you'll receive a reset link." — Maestro text selectors
# must fully match, so use a wildcard rather than the bare substring.
- extendedWaitUntil:
    visible: ".*reset link.*"
    timeout: 10000
- tapOn:
    id: "forgot-back-button"
- extendedWaitUntil:
    visible:
      id: "email-input"
    timeout: 10000
