appId: com.ironpulse.app
---
# Capture screenshot tour of the mobile app for design iteration.
# Logs in as athlete@test.com, navigates through every major screen,
# takes a screenshot at each step. Screenshots land in the cwd as
# ${name}.png via takeScreenshot.
#
# Profile-row labels below are matched against the raw text in
# app/(tabs)/profile.tsx's `sections` array (case-sensitive, e.g. "My
# program" not "My Program", "Export data" not "Export Data"). Because this
# flow hops between rows in many different sections (Communication,
# Training, Recovery, Social, Data, App) rather than visiting them top to
# bottom, each drill-in first scrolls back to the top of the Profile
# ScrollView and then scrolls down to the specific row — a single
# scrollUntilVisible(DOWN) from wherever the previous "back" left the scroll
# position isn't reliable when the next target is actually higher up.

- launchApp:
    clearKeychain: true
    clearState: true

# Login screen
- extendedWaitUntil:
    visible:
      id: "email-input"
    timeout: 60000
- takeScreenshot: 01-login
- tapOn:
    id: "email-input"
- inputText: "athlete@test.com"
- tapOn:
    id: "password-input"
- inputText: "password123"
- hideKeyboard
- tapOn:
    id: "login-button"

# Dashboard
- extendedWaitUntil:
    visible:
      id: "greeting"
    timeout: 60000
- waitForAnimationToEnd
- takeScreenshot: 02-dashboard

# Stats tab
- tapOn: "Stats"
- waitForAnimationToEnd
- takeScreenshot: 03-stats

# Exercises tab
- tapOn: "Exercises"
- waitForAnimationToEnd
- takeScreenshot: 04-exercises

# Scroll into exercise list area and tap the first row
- swipe:
    direction: UP
- waitForAnimationToEnd
- takeScreenshot: 04b-exercises-scrolled

# Profile tab
- tapOn: "Profile"
- waitForAnimationToEnd
- takeScreenshot: 06-profile

# Scroll down profile to see all sections
- swipe:
    direction: UP
- waitForAnimationToEnd
- takeScreenshot: 07-profile-scrolled

# Goals (Training section)
- scrollUntilVisible:
    element:
      text: "Goals"
    direction: DOWN
    timeout: 15000
- tapOn: "Goals"
- waitForAnimationToEnd
- takeScreenshot: 08-goals
- back

# Notifications (Communication section — back at the top)
- swipe:
    direction: DOWN
    duration: 200
- swipe:
    direction: DOWN
    duration: 200
- swipe:
    direction: DOWN
    duration: 200
- waitForAnimationToEnd
- tapOn: "Notifications"
- waitForAnimationToEnd
- takeScreenshot: 09-notifications
- back

# Nutrition (Recovery section)
- scrollUntilVisible:
    element:
      text: "Nutrition"
    direction: DOWN
    timeout: 15000
- tapOn: "Nutrition"
- waitForAnimationToEnd
- takeScreenshot: 10-nutrition
- back

# Sleep (Recovery section)
- scrollUntilVisible:
    element:
      text: "Sleep"
    direction: DOWN
    timeout: 15000
- tapOn: "Sleep"
- waitForAnimationToEnd
- takeScreenshot: 11-sleep
- back

# Program — Profile row label is "My program" (lowercase p)
- swipe:
    direction: DOWN
    duration: 200
- swipe:
    direction: DOWN
    duration: 200
- swipe:
    direction: DOWN
    duration: 200
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: "My program"
    direction: DOWN
    timeout: 15000
- tapOn: "My program"
- waitForAnimationToEnd
- takeScreenshot: 12-program
- back

# Workout Templates — Profile row label is "Workout templates" (lowercase t)
- scrollUntilVisible:
    element:
      text: "Workout templates"
    direction: DOWN
    timeout: 15000
- tapOn: "Workout templates"
- waitForAnimationToEnd
- takeScreenshot: 13-templates
- back

# Connected apps (App section, near the bottom)
- scrollUntilVisible:
    element:
      text: "Connected apps"
    direction: DOWN
    timeout: 15000
- tapOn: "Connected apps"
- waitForAnimationToEnd
- takeScreenshot: 14-integrations
- swipe:
    direction: UP
- waitForAnimationToEnd
- takeScreenshot: 15-integrations-scrolled
- back

# Settings (App section)
- scrollUntilVisible:
    element:
      text: "Settings"
    direction: DOWN
    timeout: 15000
- tapOn: "Settings"
- waitForAnimationToEnd
- takeScreenshot: 16-settings
- back

# Security — Profile row label is "Password & Passkeys"
- scrollUntilVisible:
    element:
      text: "Password & Passkeys"
    direction: DOWN
    timeout: 15000
- tapOn: "Password & Passkeys"
- waitForAnimationToEnd
- takeScreenshot: 17-security
- back

# Export Data — Profile row label is "Export data" (lowercase d)
- swipe:
    direction: DOWN
    duration: 200
- swipe:
    direction: DOWN
    duration: 200
- swipe:
    direction: DOWN
    duration: 200
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: "Export data"
    direction: DOWN
    timeout: 15000
- tapOn: "Export data"
- waitForAnimationToEnd
- takeScreenshot: 18-export
- back

# Messages (Communication section — back at the top)
- swipe:
    direction: DOWN
    duration: 200
- swipe:
    direction: DOWN
    duration: 200
- swipe:
    direction: DOWN
    duration: 200
- waitForAnimationToEnd
- tapOn: "Messages"
- waitForAnimationToEnd
- takeScreenshot: 19-messages
