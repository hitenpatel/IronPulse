appId: com.mettlelift.app
---
- launchApp:
    clearKeychain: true
    clearState: true
- extendedWaitUntil:
    visible:
      id: "email-input"
    timeout: 60000
- tapOn:
    id: "email-input"
- inputText: "test@example.com"
- tapOn:
    id: "password-input"
- inputText: "password123"
- tapOn:
    id: "login-button"
- extendedWaitUntil:
    visible:
      id: "greeting"
    timeout: 60000
- waitForAnimationToEnd
- tapOn: "Profile"
- waitForAnimationToEnd
- swipe:
    direction: UP
    duration: 500
- waitForAnimationToEnd
- tapOn: "Nutrition"
- extendedWaitUntil:
    visible:
      text: "Log Meal"
    timeout: 10000
- assertVisible: "Breakfast"
- assertVisible: "Lunch"
- assertVisible: "Dinner"
- assertVisible: "Snack"
- assertVisible: "Today's Meals"
