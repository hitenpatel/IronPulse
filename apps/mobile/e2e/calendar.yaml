appId: com.mettlelift.app
---
- launchApp:
    clearKeychain: true
    clearState: true
- extendedWaitUntil:
    visible:
      id: "email-input"
    timeout: 60000
- tapOn:
    id: "email-input"
- inputText: "test@example.com"
- tapOn:
    id: "password-input"
- inputText: "password123"
- tapOn:
    id: "login-button"
- extendedWaitUntil:
    visible:
      id: "greeting"
    timeout: 60000
- waitForAnimationToEnd
# Calendar is reached by tapping the streak card on the Home tab — that card
# renders "{N}-day streak" rather than a literal "Calendar" label.
- tapOn: ".*-day streak"
- extendedWaitUntil:
    visible: "Calendar"
    timeout: 10000
- waitForAnimationToEnd
- assertVisible: "Workout"
- assertVisible: "Cardio"
