appId: com.ironpulse.app
---
- launchApp:
    clearKeychain: true
    clearState: true
- extendedWaitUntil:
    visible:
      id: "email-input"
    timeout: 60000
- tapOn:
    id: "email-input"
- inputText: "test@example.com"
- tapOn:
    id: "password-input"
- inputText: "password123"
- tapOn:
    id: "login-button"
- extendedWaitUntil:
    visible:
      id: "greeting"
    timeout: 60000
- waitForAnimationToEnd
- tapOn: "Profile"
- waitForAnimationToEnd
# Sign out lives below the Danger zone, past every menu section — the
# Profile screen keeps growing (Communication + Training x7 + Recovery +
# Social x4 + Data + App + biometric toggle + danger zone), so scroll until
# the button (testID "sign-out-button") is actually on screen rather than
# guessing a swipe count.
- scrollUntilVisible:
    element:
      id: "sign-out-button"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "sign-out-button"
- extendedWaitUntil:
    visible:
      id: "email-input"
    timeout: 10000
