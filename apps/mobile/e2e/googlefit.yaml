appId: com.ironpulse.app
---
- launchApp:
    clearKeychain: true
    clearState: true
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "email-input"
    timeout: 60000
- tapOn:
    id: "email-input"
- inputText: "test@example.com"
- tapOn:
    id: "password-input"
- inputText: "password123"
- tapOn:
    id: "login-button"
- extendedWaitUntil:
    visible:
      id: "greeting"
    timeout: 60000
- tapOn: "Profile"
- waitForAnimationToEnd
# Connected apps is in the App section, near the bottom of a Profile screen
# that keeps growing — scroll until the row itself is visible.
- scrollUntilVisible:
    element:
      text: "Connected apps"
    direction: DOWN
    timeout: 15000
- tapOn: "Connected apps"
# Google Fit only renders when Platform.OS === "android" (see PROVIDERS in
# app/settings/integrations.tsx) — correct on this Android test device.
- assertVisible: "Google Fit"
