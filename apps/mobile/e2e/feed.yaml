appId: com.ironpulse.app
---
- launchApp:
    clearKeychain: true
    clearState: true
- extendedWaitUntil:
    visible:
      id: "email-input"
    timeout: 60000
- tapOn:
    id: "email-input"
- inputText: "test@example.com"
- tapOn:
    id: "password-input"
- inputText: "password123"
- tapOn:
    id: "login-button"
- extendedWaitUntil:
    visible:
      id: "greeting"
    timeout: 60000
- waitForAnimationToEnd
# Feed lives in the Social section of the Profile menu, well below
# Communication + Training x7 + Recovery — scroll until the row is visible.
- tapOn: "Profile"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: "Feed"
    direction: DOWN
    timeout: 15000
- tapOn: "Feed"
- extendedWaitUntil:
    visible: "Feed"
    timeout: 10000
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "No activity yet"
    commands:
      - assertVisible: "No activity yet"
- runFlow:
    when:
      notVisible: "No activity yet"
    commands:
      - assertVisible: "completed a workout"
