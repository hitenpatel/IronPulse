appId: com.ironpulse.app
---
- launchApp:
    clearKeychain: true
    clearState: true
- extendedWaitUntil:
    visible:
      id: "email-input"
    timeout: 60000
- tapOn:
    id: "email-input"
- inputText: "test@example.com"
- tapOn:
    id: "password-input"
- inputText: "password123"
- tapOn:
    id: "login-button"
- extendedWaitUntil:
    visible:
      id: "greeting"
    timeout: 60000
- waitForAnimationToEnd
# Profile menu item is "Progress photos" (sentence case); screen header
# now reads "Upload progress photos" (sentence case too).
- tapOn: "Profile"
- waitForAnimationToEnd
- swipe:
    direction: UP
    duration: 500
- waitForAnimationToEnd
- tapOn: "Progress photos"
- extendedWaitUntil:
    visible:
      text: "Upload progress photos"
    timeout: 10000
