appId: com.ironpulse.app
---
- launchApp:
    clearKeychain: true
    clearState: true
- extendedWaitUntil:
    visible:
      id: "email-input"
    timeout: 60000
- tapOn:
    id: "email-input"
- inputText: "test@example.com"
- tapOn:
    id: "password-input"
- inputText: "password123"
- tapOn:
    id: "login-button"
- extendedWaitUntil:
    visible:
      id: "greeting"
    timeout: 60000
- waitForAnimationToEnd
- tapOn: "Profile"
- waitForAnimationToEnd
# Connected apps is in the App section, near the bottom of a Profile screen
# that keeps growing — scroll until the row itself is visible.
- scrollUntilVisible:
    element:
      text: "Connected apps"
    direction: DOWN
    timeout: 15000
- tapOn: "Connected apps"
- extendedWaitUntil:
    visible: "Strava"
    timeout: 10000
- assertVisible: "Polar"
- assertVisible: "Withings"
- assertVisible: "Oura"
