appId: com.mettlelift.app
---
- launchApp:
    clearKeychain: true
    clearState: true
- extendedWaitUntil:
    visible:
      id: "email-input"
    timeout: 60000
- tapOn:
    id: "email-input"
- inputText: "test@example.com"
- tapOn:
    id: "password-input"
- inputText: "password123"
- tapOn:
    id: "login-button"
- extendedWaitUntil:
    visible:
      id: "greeting"
    timeout: 60000
- waitForAnimationToEnd
- tapOn: "Profile"
- waitForAnimationToEnd
# Scroll Profile to reach App section (Connected apps lives near the bottom)
- swipe:
    direction: UP
    duration: 500
- swipe:
    direction: UP
    duration: 500
- waitForAnimationToEnd
- tapOn: "Connected apps"
- extendedWaitUntil:
    visible: "Strava"
    timeout: 10000
- assertVisible: "Polar"
- assertVisible: "Withings"
- assertVisible: "Oura"
