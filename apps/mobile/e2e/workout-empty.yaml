appId: com.ironpulse.app
---
- launchApp:
    clearKeychain: true
    clearState: true
- extendedWaitUntil:
    visible:
      id: "email-input"
    timeout: 60000
- tapOn:
    id: "email-input"
- inputText: "test@example.com"
- tapOn:
    id: "password-input"
- inputText: "password123"
- tapOn:
    id: "login-button"
- extendedWaitUntil:
    visible:
      id: "greeting"
    timeout: 60000
- waitForAnimationToEnd
- tapOn:
    id: "fab-button"
- extendedWaitUntil:
    visible: "Start Workout"
    timeout: 10000
- tapOn: "Start Workout"
- extendedWaitUntil:
    visible: "Empty Workout"
    timeout: 10000
- tapOn: "Empty Workout"
- extendedWaitUntil:
    visible: "Finish"
    timeout: 10000
- waitForAnimationToEnd
- tapOn:
    id: "add-exercise-button"
# Picker is now ExerciseMultiPicker (components/workout/exercise-multi-picker.tsx):
# search field testID is "search-input" (not "exercise-search-input"), and
# result rows are testID `exercise-option-{id}` (a DB-generated uuid, not
# tappable by name) — tap the result by its visible label instead.
- extendedWaitUntil:
    visible:
      id: "search-input"
    timeout: 10000
# The E2E seed fixture util (packages/db/scripts/reset-mobile-e2e-utils.ts,
# REQUIRED_EXERCISE_NAMES) guarantees "Barbell Bench Press - Medium Grip" is
# present — there is no exercise literally named "Bench Press" in
# packages/db/seeds/exercises.json, so match the real full name.
- tapOn:
    id: "search-input"
- inputText: "Barbell Bench Press"
- extendedWaitUntil:
    visible: "Barbell Bench Press - Medium Grip"
    timeout: 10000
- tapOn: "Barbell Bench Press - Medium Grip"
- extendedWaitUntil:
    visible: "Finish"
    timeout: 15000
- scrollUntilVisible:
    element:
      id: "weight-input-0-0"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "weight-input-0-0"
- inputText: "80"
- tapOn:
    id: "reps-input-0-0"
- inputText: "8"
- tapOn:
    id: "complete-set-0-0"
- tapOn:
    id: "finish-button"
- extendedWaitUntil:
    visible: "Workout Complete"
    timeout: 60000
- tapOn: "Done"
- extendedWaitUntil:
    visible:
      id: "greeting"
    timeout: 60000
